name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: insightdoc-production
  cancel-in-progress: false

jobs:
  deploy:
    # This runner must be installed on the production host and labeled
    # insightdoc-prod. The runner executes the existing, audited deploy script.
    runs-on: [self-hosted, linux, x64, insightdoc-prod]
    timeout-minutes: 30
    steps:
      - name: Update and restart InsightDOC
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/InsightOCRv2
          git fetch origin --prune
          git reset --hard origin/main
          git status --short --branch
          DEPLOY_SYNC_TO_ORIGIN=true DEPLOY_ALLOW_DIRTY_RESET=true scripts/services.sh update

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/InsightOCRv2
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          docker compose ps
          docker compose exec -T backend curl --fail --silent http://localhost:8000/health
          docker compose exec -T nginx wget --quiet --tries=1 --spider http://127.0.0.1/health
          test "$(docker inspect --format '{{.State.Running}} {{.State.Restarting}}' "$(docker compose ps -q celery_beat)")" = "true false"
          docker compose exec -T celery_worker sh -lc 'celery -A app.celery_app inspect ping -d "celery@$(hostname)" --timeout=10'
          docker compose exec -T celery_workflow_worker sh -lc 'celery -A app.celery_app inspect ping -d "celery@$(hostname)" --timeout=10'

      - name: Collect failed deployment diagnostics
        if: failure()
        shell: bash
        run: |
          cd /home/ubuntu/InsightOCRv2
          docker compose ps --all
          docker inspect --format '{{json .State.Health}}' softnix_ocr_backend
          docker compose logs --tail=100 backend celery_worker celery_workflow_worker celery_beat
